<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPPC Cost Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>UPPC Cost Admin</h1>
    <nav>
      <!-- Navigation removed - stores users should only access admin functions -->
    </nav>
  </header>

  <main>
    <div id="status" class="admin-status"></div>

    <section class="page-card">
      <div class="section-header">
        <h2>Materials</h2>
        <button id="refresh-admin-data" class="secondary-button"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      </div>
      <div class="admin-toolbar" aria-label="Materials controls">
        <div class="admin-search">
          <i class="bi bi-search"></i>
          <input type="search" id="materials-search" placeholder="Search materials...">
        </div>
        <select id="materials-category-filter" aria-label="Filter materials by category">
          <option value="">All categories</option>
        </select>
        <select id="materials-sort" aria-label="Sort materials">
          <option value="name:asc">Name A-Z</option>
          <option value="name:desc">Name Z-A</option>
          <option value="category:asc">Category A-Z</option>
          <option value="category:desc">Category Z-A</option>
          <option value="unit_of_measure:asc">Unit A-Z</option>
          <option value="unit_of_measure:desc">Unit Z-A</option>
          <option value="unit_cost:asc">Lowest cost</option>
          <option value="unit_cost:desc">Highest cost</option>
        </select>
      </div>
      <div class="admin-section">
        <table id="admin-materials-table" class="admin-table">
          <thead>
            <tr>
              <th><button type="button" class="sort-header" data-table="materials" data-sort="name">Name <i class="bi bi-arrow-down-up"></i></button></th>
              <th><button type="button" class="sort-header" data-table="materials" data-sort="category">Category <i class="bi bi-arrow-down-up"></i></button></th>
              <th><button type="button" class="sort-header" data-table="materials" data-sort="unit_of_measure">Unit <i class="bi bi-arrow-down-up"></i></button></th>
              <th><button type="button" class="sort-header" data-table="materials" data-sort="unit_cost">Unit Cost <i class="bi bi-arrow-down-up"></i></button></th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="admin-form-card">
        <h3>Add New Material</h3>
        <form id="create-material-form">
          <div class="form-row">
            <input type="text" id="new-material-name" placeholder="Name" required>
            <input type="text" id="new-material-category" placeholder="Category">
            <input type="text" id="new-material-unit" placeholder="Unit of measure">
            <input type="number" id="new-material-cost" placeholder="Unit cost" min="0" step="0.01" required>
            <button type="submit" class="primary-button">Add Material</button>
          </div>
        </form>
      </div>
    </section>

    <section class="page-card">
      <div class="section-header">
        <h2>Machines</h2>
      </div>
      <div class="admin-toolbar" aria-label="Machines controls">
        <div class="admin-search">
          <i class="bi bi-search"></i>
          <input type="search" id="machines-search" placeholder="Search machines...">
        </div>
        <select id="machines-setup-filter" aria-label="Filter machines by setup cost">
          <option value="">All setup costs</option>
          <option value="with-setup">With setup cost</option>
          <option value="no-setup">No setup cost</option>
        </select>
        <select id="machines-sort" aria-label="Sort machines">
          <option value="name:asc">Name A-Z</option>
          <option value="name:desc">Name Z-A</option>
          <option value="cost_per_impression:asc">Lowest impression cost</option>
          <option value="cost_per_impression:desc">Highest impression cost</option>
          <option value="setup_cost:asc">Lowest setup cost</option>
          <option value="setup_cost:desc">Highest setup cost</option>
        </select>
      </div>
      <div class="admin-section">
        <table id="admin-machines-table" class="admin-table">
          <thead>
            <tr>
              <th><button type="button" class="sort-header" data-table="machines" data-sort="name">Name <i class="bi bi-arrow-down-up"></i></button></th>
              <th><button type="button" class="sort-header" data-table="machines" data-sort="cost_per_impression">Cost / Impression <i class="bi bi-arrow-down-up"></i></button></th>
              <th><button type="button" class="sort-header" data-table="machines" data-sort="setup_cost">Setup Cost <i class="bi bi-arrow-down-up"></i></button></th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="admin-form-card">
        <h3>Add New Machine</h3>
        <form id="create-machine-form">
          <div class="form-row">
            <input type="text" id="new-machine-name" placeholder="Machine name" required>
            <input type="number" id="new-machine-cost" placeholder="Cost per impression" min="0" step="0.01" required>
            <input type="number" id="new-machine-setup" placeholder="Setup cost" min="0" step="0.01">
            <button type="submit" class="primary-button">Add Machine</button>
          </div>
        </form>
      </div>
    </section>

    <section class="page-card">
      <div class="section-header">
        <h2>Users</h2>
      </div>
      <div class="admin-section">
        <table id="admin-users-table" class="admin-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Full Name</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="admin-form-card">
        <h3>Add New User</h3>
        <form id="create-user-form">
          <div class="form-row">
            <input type="text" id="new-user-username" placeholder="Username" required>
            <input type="text" id="new-user-fullname" placeholder="Full name">
            <input type="password" id="new-user-password" placeholder="Password" required>
            <select id="new-user-role">
              <option value="costing">Costing</option>
              <option value="stores">Stores</option>
            </select>
            <button type="submit" class="primary-button">Add User</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
